name: Verify Public Site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exported public site
        run: ruby Scripts/verify_public_site_export.rb . docs/PUBLIC_SITE_EXPORT_ASSERTIONS.json --verbose
